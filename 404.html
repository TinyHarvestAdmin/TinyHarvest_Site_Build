<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Tiny Harvest Microgreens</title>
  <style>
    :root{--cream:#fbf8ef;--paper:#fffdf7;--green:#163f2d;--green2:#047857;--mint:#ecfdf5;--fresh:#d9f99d;--text:#1c1917;--muted:#57534e;--shadow:0 24px 60px rgba(6,78,59,.18)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 10%,rgba(16,185,129,.18),transparent 33%),radial-gradient(circle at 90% 90%,rgba(250,204,21,.22),transparent 38%),var(--cream)}
    main{position:relative;width:min(760px,100%);text-align:center;background:rgba(255,253,247,.86);border:1px solid rgba(6,78,59,.12);border-radius:42px;padding:48px 32px;box-shadow:var(--shadow);backdrop-filter:blur(10px);overflow:hidden}
    main:before{content:"";position:absolute;inset:14px;border:1px solid rgba(6,78,59,.08);border-radius:32px;pointer-events:none}
    .logo{position:relative;width:min(230px,58vw);aspect-ratio:1;margin:0 auto 22px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 15px 38px rgba(6,78,59,.16)}
    .logo img{display:block;width:100%;height:100%;object-fit:cover}
    .code{position:relative;display:inline-flex;padding:8px 14px;border-radius:999px;background:var(--mint);border:1px solid rgba(4,120,87,.18);color:var(--green2);font-size:13px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
    h1{position:relative;margin:18px 0 12px;color:#052e25;font-size:clamp(38px,7vw,64px);line-height:1;letter-spacing:-.045em}
    p{position:relative;max-width:560px;margin:0 auto;color:var(--muted);font-size:18px;line-height:1.65}
    .actions{position:relative;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:999px;font-weight:900;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
    .primary{background:var(--green);color:#fff;box-shadow:0 10px 24px rgba(6,78,59,.2)}
    .secondary{background:#fff;color:var(--green);border:1px solid var(--green)}
    .btn:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(6,78,59,.22)}
    .primary:hover{background:#052e25}
    footer{position:relative;margin-top:30px;color:#78716c;font-size:13px}
    @media(max-width:520px){main{padding:36px 20px;border-radius:30px}.actions{flex-direction:column}.btn{width:100%}}
    @media(prefers-reduced-motion:reduce){.btn{transition:none}}
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="assets/images/Tiny Harvest Logo.jpg" alt="Tiny Harvest Microgreens logo"></div>
    <div class="code">Error 404</div>
    <h1>This page hasn’t sprouted.</h1>
    <p>The page you’re looking for may have moved, been renamed or no longer exists. Head back to Tiny Harvest and explore fresh microgreens.</p>
    <div class="actions">
      <a class="btn primary" href="/">Return to homepage</a>
      <!--
        <a class="btn secondary" href="/#shop">Browse microgreens</a>
        -->
    </div>
    <footer>© <span id="year"></span> Tiny Harvest Microgreens</footer>
  </main>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
